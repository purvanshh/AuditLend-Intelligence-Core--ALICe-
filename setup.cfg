[metadata]
name = auditlend
version = 2.0.0
description = Audit-grade credit decision engine

[options]
packages = find:
python_requires = >=3.11

[options.entry_points]
console_scripts =
    auditlend-portfolio = cli.portfolio:main

[options.packages.find]
include =
    ml*
    cli*
    api*
    services*
